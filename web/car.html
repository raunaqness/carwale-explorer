<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cars Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="filters">
  <a href="./" class="back">← All cars</a>
  <h1 id="title">Cars Explorer</h1>
  <p class="muted" id="subtitle"></p>
  <fieldset><legend>Transmission</legend><div id="f-transmission"></div></fieldset>
  <fieldset><legend>Engine / fuel type</legend><div id="f-fuel"></div></fieldset>
  <fieldset>
    <legend>Variants</legend>
    <p class="muted">Untick to hide a column. Use the ◂ / ✕ buttons in a column header to collapse or hide it.</p>
    <button id="show-all" type="button">Show all / expand all</button>
    <div id="f-variants"></div>
  </fieldset>
</aside>
<main>
  <div id="hero"></div>
  <div id="count" class="muted"></div>
  <div class="table-wrap"><table id="table" class="detail"></table></div>
  <p id="msg" class="muted"></p>
</main>
<script src="storage.js"></script>
<script src="car.js"></script>
</body>
</html>
